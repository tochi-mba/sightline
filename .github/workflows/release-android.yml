# The Android download: the signed APK, and what the site and the app read about it.
#
# The same two cadences as the Windows release: every merge to main replaces the rolling `latest-android`
# prerelease, and a `v*` tag cuts a release that never changes. Unfiltered by path for the same reason.
#
# The APK is signed with the release key held in this repository's secrets. A phone will only take an
# update signed with the key it installed from, so an APK signed with any other key, a debug one included,
# could never update an installed Sightline: this workflow refuses to publish one.
name: Release for Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/android-setup

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          python3 tools/scripts/release_version.py --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --run "$GITHUB_RUN_NUMBER" \
            --commits "$(git rev-list --count HEAD)" | tee -a "$GITHUB_OUTPUT"

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGHTLINE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGHTLINE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGHTLINE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGHTLINE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Release signing is required; SIGHTLINE_$name is not set." >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/sightline.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "SIGHTLINE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # A release never ships code that does not pass its own checks.
      - name: Check, then build the release APK
        env:
          SIGHTLINE_KEYSTORE_PASSWORD: ${{ secrets.SIGHTLINE_KEYSTORE_PASSWORD }}
          SIGHTLINE_KEY_ALIAS: ${{ secrets.SIGHTLINE_KEY_ALIAS }}
          SIGHTLINE_KEY_PASSWORD: ${{ secrets.SIGHTLINE_KEY_PASSWORD }}
        run: >
          ./gradlew :protocol:check :android:core:check :android:design:check :android:app:check
          :android:app:assembleRelease --console plain
          -Psightline.versionCode=${{ steps.version.outputs.code }}
          -Psightline.versionName=${{ steps.version.outputs.version }}

      - name: Verify the signature, and describe the download
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "No signed release APK was built." >&2; exit 1; }
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)
          certificates=$("$apksigner" verify --print-certs "$apk")
          if echo "$certificates" | grep -q 'CN=Android Debug'; then
            echo "The APK is signed with a debug key." >&2
            exit 1
          fi
          mkdir -p dist/android
          cp "$apk" dist/android/Sightline.apk
          cp "$apk" "dist/android/Sightline-$VERSION.apk"
          cp apps/android/app/build/outputs/mapping/release/mapping.txt "dist/android/Sightline-$VERSION-mapping.txt"
          size=$(stat -c %s dist/android/Sightline.apk)
          sha=$(sha256sum dist/android/Sightline.apk | cut -d' ' -f1)
          printf '{\n  "schema": 1,\n  "version": "%s",\n  "versionCode": %s,\n  "minimumAndroid": 10,\n  "downloads": [ { "name": "Sightline.apk", "size": %s, "sha256": "%s" } ]\n}\n' \
            "$VERSION" "$CODE" "$size" "$sha" > dist/android/android-release.json
          (cd dist/android && sha256sum $(ls | grep -v SHA256SUMS.txt) > SHA256SUMS.txt)
          cat dist/android/android-release.json

      - name: Clear the previous rolling build
        if: steps.version.outputs.tagged == 'false' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! gh release view latest-android --json tagName > /dev/null 2>&1; then
            echo "No rolling release yet."
            exit 0
          fi
          for asset in $(gh release view latest-android --json assets --jq '.assets[].name'); do
            gh release delete-asset latest-android "$asset" --yes || exit 1
          done

      - name: Publish the rolling prerelease
        if: steps.version.outputs.tagged == 'false' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest-android
          target_commitish: ${{ github.sha }}
          name: Sightline for Android (rolling)
          prerelease: true
          make_latest: false
          files: dist/android/*
          body: |
            **The newest build of Sightline for Android, replaced on every merge.** Version
            `${{ steps.version.outputs.version }}`. For a build that will not change under you, use a `v*` release.

            **Android 10 or newer.** Download `Sightline.apk` on the phone and open it; Android asks once to allow
            installing apps from your browser. Sightline is not in the Play Store. `SHA256SUMS.txt` has the hash.

      - name: Move the rolling tag
        if: steps.version.outputs.tagged == 'false' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git tag -f latest-android "$GITHUB_SHA"
          git push -f origin refs/tags/latest-android

      - name: Publish the tagged release
        if: steps.version.outputs.tagged == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/android/*
          generate_release_notes: true
          body: |
            **Android 10 or newer.** Download `Sightline.apk` on the phone and open it. Sightline is not in the
            Play Store. `SHA256SUMS.txt` has the hash.
