# Publishes site/ to GitHub Pages. The site is plain static HTML with no build step, so there is
# nothing to compile: only checks before it goes live — the page's own promises and links, the
# checker's tests, and the script's tests, which hold app.js to every line and branch.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/scripts/check_site.py"
      - "tools/scripts/tests/test_check_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run finishes after the one in flight rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check the site
        run: python tools/scripts/check_site.py

      - name: Test the checker
        run: python -m unittest discover -s tools/scripts/tests

      - name: Test the page's script
        run: node --test --experimental-test-coverage site/tests

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
