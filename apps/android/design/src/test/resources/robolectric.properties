# Robolectric's newest Android is 35 (the app targets 36, which it cannot run yet). The phone this is
# built for, a Galaxy S21 Ultra, runs 35.
sdk=35
# Real graphics, so frames, thumbnails and snapshots are decoded as on a phone.
graphicsMode=NATIVE
# The S21 Ultra's screen; a test about a wider one sets its own.
qualifiers=w412dp-h915dp-xxhdpi
