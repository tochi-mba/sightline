# Every JVM and Android version in the build, written once.
#
# Rules for adding an entry:
#   - Pin an exact version. A range makes a build that passed today fail tomorrow for no commit.
#   - Say why in a comment when the version is not simply the newest.
#
# The toolchain pins match REX Technologies' textwire and Flint apps, which build on the same machine
# against the same SDK.

[versions]
# The JDK every module compiles against, through the toolchain.
jdk = "17"
agp = "9.4.1"
kotlin = "2.4.20"
jacoco = "0.8.14"
# Formatting follows the pinned ktlint release, locally and in CI alike.
ktlint = "1.8.0"

# The Android app, under apps/android/.
compile-sdk = "36"
target-sdk = "36"
# Android 10: WifiNetworkSpecifier, which joins the camera's Wi-Fi without giving up the phone's
# internet connection, starts here.
min-sdk = "29"

# AndroidX and Compose. Core 1.19+ and Compose BOM 2026.09+ need compile SDK 37, which cannot be
# installed here (platform 36 is the only one available), so these stay on the pins Flint and
# textwire already build with on this machine rather than on the newest releases.
androidx-activity-compose = "1.13.0"
androidx-core = "1.16.0"
compose-bom = "2026.05.00"

coroutines = "1.11.0"

junit = "4.13.2"
robolectric = "4.17"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }

# Versions from the BOM, so every Compose artifact moves together.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
# Depended on by :android:design alone. Screens draw with its components, never with Material's.
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# Virtual time: a test of an eight-second stall or a two-second poll runs in milliseconds.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
# The Android modules' tests run on the JVM, against a real Android framework, through Robolectric.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

# What the convention plugins in tools/build-logic compile against. The build that applies them
# already has these on its classpath, at the same versions.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Run as a plain JavaExec rather than through a Gradle plugin: the command-line distribution only has
# to be on a classpath, so the lint gate can never be what breaks a Gradle or Kotlin upgrade.
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
